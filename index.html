let selectedAnswers = {};

function renderQuiz() {
    const quizList = document.getElementById('quiz-list');
    quizList.innerHTML = '';

    quizData.forEach((qData, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        qData.options.forEach((opt, oIndex) => {
            optionsHTML += `<li class="option-item" id="opt-${qIndex}-${oIndex}" onclick="selectOption(${qIndex}, ${oIndex})">${opt}</li>`;
        });

        card.innerHTML = `
            <div class="question-title">${qData.q}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation" id="exp-${qIndex}">${qData.exp.replace(/\n/g, '<br>')}</div>
        `;
        quizList.appendChild(card);
    });
}

function selectOption(qIndex, oIndex) {
    if (selectedAnswers[qIndex] !== undefined) return; // Freeze after selection

    selectedAnswers[qIndex] = oIndex;
    const correctAns = quizData[qIndex].ans;

    qDataOptions = quizData[qIndex].options;
    qDataOptions.forEach((_, optIdx) => {
        const el = document.getElementById(`opt-${qIndex}-${optIdx}`);
        el.style.pointerEvents = 'none';
        if (optIdx === correctAns) {
            el.classList.add('correct');
        } else if (optIdx === oIndex) {
            el.classList.add('wrong');
        }
    });

    document.getElementById(`exp-${qIndex}`).style.display = 'block';
}

function submitQuiz() {
    let score = 0;
    quizData.forEach((qData, qIndex) => {
        if (selectedAnswers[qIndex] === qData.ans) {
            score++;
        }
        // Show explanation for unattempted questions
        document.getElementById(`exp-${qIndex}`).style.display = 'block';
        qData.options.forEach((_, optIdx) => {
            const el = document.getElementById(`opt-${qIndex}-${optIdx}`);
            el.style.pointerEvents = 'none';
            if (optIdx === qData.ans) {
                el.classList.add('correct');
            }
        });
    });

    document.getElementById('score').innerText = score;
    document.getElementById('score-board').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
